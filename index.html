
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CultuRama</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="assets/culturama-favico.png" type="image/png">
</head>

<body>

    <header>
        <img class="logo" src="assets/logo-culturama.png" alt="Logo CultuRama">
        <h1><strong>Pesquisa Online</strong></h1>
    </header>

    <section>

        <form action="" method="get" enctype="multipart/form-data">

            <fieldset class="profile">

                <legend>
                    <strong>Dados Pessoais</strong>
                </legend>

                <div class="info-pessoal">

                    <label class="label" for="name">Nome:</label>
                    <input
                        class="input-texto"
                        id="name"
                        type="text"
                        name="userName"
                        required>

                    <label class="label" for="age">Idade:</label>
                    <input
                        class="input-texto"
                        id="age"
                        type="number"
                        name="userAge"
                        min="12"
                        max="100"
                        required>

                    <label class="label" for="birthdate">Data de nascimento:</label>
                    <input
                        class="input-texto"
                        id="birthdate"
                        type="date"
                        name="birthDate">

                    <label class="label" for="email">E-mail:</label>
                    <input
                        class="input-texto"
                        id="email"
                        type="email"
                        name="email"
                        required>

                    <label class="label" for="phonenumber">Telefone:</label>
                    <input
                        class="input-texto"
                        id="phonenumber"
                        type="tel"
                        name="userPhoneNumber"
                        pattern="[0-9]{11}"
                        placeholder="DDD + número">

                    <p class="p">
                        <strong>
                            Preencha com 11 digitos no formato: DDD + número
                        </strong>
                    </p>

                    <label class="label" for="userImage">Upload de foto</label>

                    <div class="upload-container">
                        <input
                            class="input-img"
                            id="userImage"
                            type="file"
                            name="userImage"
                            accept="image/*">
                    </div>

                    <p class="p">
                        <strong>
                            Escolha uma foto no formato PNG ou JPEG
                        </strong>
                    </p>

                </div>

            </fieldset>


            <fieldset class="profile">

                <legend>
                    <strong>Perfil</strong>
                </legend>

                <div class="perfil">

                    <p>Gênero:</p>

                    <div class="generos">

                        <div class="generos-options">
                            <input
                                id="male"
                                type="radio"
                                name="userGender"
                                value="Masculino">
                            <label class="label-generos" for="male">Masculino</label>
                        </div>

                        <div class="generos-options">
                            <input
                                id="female"
                                type="radio"
                                name="userGender"
                                value="Feminino">
                            <label class="label-generos" for="female">Feminino</label>
                        </div>

                        <div class="generos-options">
                            <input
                                id="other"
                                type="radio"
                                name="userGender"
                                value="Outro">
                            <label class="label-generos" for="other">Outro</label>
                        </div>

                    </div>

                    <div class="estado-civil">

                        <label class="label" for="maritalStatus">Estado civil:</label>

                        <select
                            class="caixa-select"
                            id="maritalStatus"
                            name="maritalStatus"
                            required>

                            <option value="">Selecione...</option>
                            <option value="Casado">Casado</option>
                            <option value="Solteiro">Solteiro</option>
                            <option value="Divorciado">Divorciado</option>
                            <option value="União-estável">União estável</option>

                        </select>

                    </div>

                    <div class="estados">

                        <label class="label" for="userStates">Estado:</label>

                        <select
                            class="caixa-select"
                            id="userStates"
                            name="userStates"
                            required>

                            <option value="">Selecione...</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>

                        </select>

                    </div>

                    <div class="cidade">

                        <label class="label" for="city">Cidade:</label>
                        <input
                            class="input-texto"
                            id="city"
                            type="text"
                            name="userCity"
                            required>

                    </div>

                </div>

            </fieldset>


            <fieldset class="profile">

                <legend>
                    <strong>Hábitos</strong>
                </legend>

                <div class="habitos">

                    <p>Redes sociais:</p>

                    <div class="redes-sociais">
                        <input
                            id="instagram"
                            type="checkbox"
                            name="social"
                            value="instagram">
                        <label for="instagram">Instagram</label>
                    </div>

                    <div class="redes-sociais">
                        <input
                            id="facebook"
                            type="checkbox"
                            name="social"
                            value="facebook">
                        <label for="facebook">Facebook</label>
                    </div>

                    <div class="redes-sociais">
                        <input
                            id="linkedin"
                            type="checkbox"
                            name="social"
                            value="linkedin">
                        <label for="linkedin">LinkedIn</label>
                    </div>

                    <div class="redes-sociais">
                        <input
                            id="x"
                            type="checkbox"
                            name="social"
                            value="x">
                        <label for="x">X</label>
                    </div>

                    <div class="estilo-musical">

                        <label for="musicStyle">Estilo musical:</label>

                        <input
                            list="styleTypes"
                            id="musicStyle"
                            type="text"
                            name="userMusicStyle">

                        <datalist id="styleTypes">
                            <option value="Rock"></option>
                            <option value="Pop"></option>
                            <option value="Samba"></option>
                            <option value="Sertanejo"></option>
                        </datalist>

                    </div>

                    <div class="cor-favorita">

                        <label for="favoriteColor">Cor favorita:</label>

                        <input
                            type="color"
                            name="userFavoriteColor"
                            id="favoriteColor">

                    </div>

                </div>

            </fieldset>


            <fieldset class="profile">

                <legend>
                    <strong>Opinião</strong>
                </legend>

                <div class="opiniao">

                    <p>O que você acha da qualidade do nosso serviço?</p>

                    <div class="opiniao-intero">
                        <input
                            id="great"
                            type="radio"
                            name="userOpinion">
                        <label for="great">Ótimo</label>
                    </div>

                    <div class="opiniao-intero">
                        <input
                            id="good"
                            type="radio"
                            name="userOpinion">
                        <label for="good">Bom</label>
                    </div>

                    <div class="opiniao-intero">
                        <input
                            id="regular"
                            type="radio"
                            name="userOpinion">
                        <label for="regular">Regular</label>
                    </div>

                    <div class="opiniao-intero">
                        <input
                            id="bad"
                            type="radio"
                            name="userOpinion">
                        <label for="bad">Bad</label>
                    </div>

                    <div class="opnion-text">

                        <label for="opinionText">Escreva sua opinião:</label>

                        <textarea
                            id="opinionText"
                            name="userOpinonText"
                            placeholder="Digite aqui..."></textarea>

                    </div>

                </div>

            </fieldset>


            <fieldset class="profile">

                <legend>
                    <strong>Confirmações</strong>
                </legend>

                <div class="confirmacoes">

                    <div class="confirmacoes-interno">
                        <input
                            id="aceptParticipation"
                            type="checkbox"
                            name="userAceptParticipation"
                            value="accepted"
                            required>
                        <label for="aceptParticipation">Aceito participar da pesquisa</label>
                    </div>

                    <div class="confirmacoes-interno">
                        <input
                            id="resulForEmail"
                            type="checkbox"
                            name="userResulForEmail">
                        <label for="resulForEmail">Receber resultado por email</label>
                    </div>

                </div>

            </fieldset>


            <div class="button-enviar">
                <button type="submit">Enviar</button>
            </div>

        </form>

    </section>

</body>

</html>
