<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultu Rama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
                    <div class="info-pessoal">

            <label for="userName">Nome</label>
            <input type="text" name="userName" required>
        <br>
            <label for="userAge">Idade</label>
            <input type="number" name="userAge" min="12" max="100" required>
        <br>
            <label for="birthDate">Data de nascimeto</label>
            <input type="date" name="birthDate">
        <br>
            <label for="email">Email</label>
            <input type="email" name="email" required>
        <br>
            <label for="userPhoneNumber">Telefone</label>
            <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número">
        <br>
            <label for="userImage">Upload</label>
            <input type="image" name="userImage">
        <br>     
            <button type="submit">Enviar</button>
            
                    </div>      
                </fieldset>  
            </form>
        </section>

</body>
</html>
